<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Media for Alexa</title>
<link rel="icon" href="/static/cover.svg">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#14161c">
<script>
  // aplica el tema guardado antes de pintar (sin parpadeo)
  try { var t = localStorage.getItem("lm-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  try { if (localStorage.getItem("lm-side") === "collapsed") document.documentElement.classList.add("side-collapsed"); } catch (e) {}
</script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-box">
    <img src="/static/cover.svg" alt="" width="64" height="64">
    <h1>Local Media <span class="brand-sub">for Alexa</span></h1>
    <input type="password" id="loginPw" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn primary" type="submit">Entrar</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="layout">
  <aside id="side" class="side">
    <div class="brand"><img src="/static/cover.svg" alt="" width="28" height="28"> <span class="lb">Local Media <span class="brand-sub">for Alexa</span></span>
      <button type="button" id="sideToggle" class="side-toggle" aria-label="Recoger el menú" title="Recoger el menú">«</button></div>
    <form id="searchForm" class="search"><input id="searchBox" type="search" placeholder="Buscar en tu música…"></form>
    <nav>
      <a href="#/" data-nav="home" title="Inicio"><span class="ic">🏠</span><span class="lb">Inicio</span></a>
      <a href="#/artists" data-nav="artists" title="Artistas"><span class="ic">🎤</span><span class="lb">Artistas</span></a>
      <a href="#/albums" data-nav="albums" title="Álbumes"><span class="ic">💿</span><span class="lb">Álbumes</span></a>
      <a href="#/tracks" data-nav="tracks" title="Canciones"><span class="ic">🎵</span><span class="lb">Canciones</span></a>
      <a href="#/genres" data-nav="genres" title="Géneros"><span class="ic">🎸</span><span class="lb">Géneros</span></a>
      <a href="#/folders" data-nav="folders" title="Carpetas"><span class="ic">📁</span><span class="lb">Carpetas</span></a>
      <a href="#/playlists" data-nav="playlists" title="Listas"><span class="ic">📜</span><span class="lb">Listas</span></a>
      <a href="#/favorites" data-nav="favorites" title="Favoritas"><span class="ic">⭐</span><span class="lb">Favoritas</span></a>
      <a href="#/radios" data-nav="radios" title="Radios"><span class="ic">📻</span><span class="lb">Radios</span></a>
      <div class="sep"></div>
      <a href="#/alexa" data-nav="alexa" title="Alexa"><span class="ic">🔊</span><span class="lb">Alexa</span></a>
      <a href="#/setup" data-nav="setup" title="Configurar Alexa"><span class="ic">🧭</span><span class="lb">Configurar Alexa</span></a>
      <a href="#/settings" data-nav="settings" title="Ajustes"><span class="ic">⚙️</span><span class="lb">Ajustes</span></a>
    </nav>
    <div class="side-foot">
      <div id="scanBadge" class="scan-badge hidden"></div>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button data-theme-set="auto" title="Seguir al sistema">🖥 Auto</button>
        <button data-theme-set="dark" title="Modo oscuro">🌙 Oscuro</button>
        <button data-theme-set="light" title="Modo claro">☀️ Claro</button>
      </div>
    </div>
  </aside>
  <div id="sideBackdrop" class="side-backdrop" hidden></div>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Menú">☰</button>
    <span class="brand small"><img src="/static/cover.svg" alt="" width="22" height="22"> <span>Local Media <span class="brand-sub">for Alexa</span></span></span>
    <button id="themeBtn" class="icon-btn theme-btn" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
  </header>
  <main id="main" class="main"></main>

  <footer class="player">
    <div class="np">
      <img id="npArt" src="/static/cover.svg" alt="">
      <div class="np-text"><div id="npTitle" class="np-title">Nada sonando</div><div id="npSub" class="np-sub"></div></div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="pShuffle" class="icon-btn" title="Aleatorio">🔀</button>
        <button id="pPrev" class="icon-btn" title="Anterior">⏮</button>
        <button id="pPlay" class="icon-btn big" title="Reproducir">▶</button>
        <button id="pNext" class="icon-btn" title="Siguiente">⏭</button>
        <button id="pLoop" class="icon-btn" title="Repetir">🔁</button>
      </div>
      <div class="seek"><span id="pCur">0:00</span><input id="pSeek" type="range" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
    </div>
    <div class="extra">
      <button id="pQueue" class="icon-btn" title="Cola">☰</button>
      <button id="pOut" class="out-btn" type="button" title="Elegir dónde suena" aria-haspopup="dialog"><span id="pOutIc">💻</span><span id="pOutLb" class="out-lb">Este navegador</span><span class="out-caret">▾</span></button>
      <input id="pVol" type="range" min="0" max="100" value="90" title="Volumen">
    </div>
    <audio id="audio" preload="auto"></audio>
  </footer>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="icon-btn modal-x" id="modalX">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
